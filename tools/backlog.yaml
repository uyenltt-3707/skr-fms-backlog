# Backlog LAB-5 Product A — dữ liệu TỰ VIẾT (không chép spec LAB-4 / RFP; chỉ ghi mã SCR-/API-/DBT-/ADR-/DD-/FS-/CSP-/WU-).
# Nguồn break: bàn giao LAB-4 (product-a-fishmarket @ 576480b, specs/_meta/lab5_handoff.yaml — 95 WU, 13 epic).
#
# Cấu trúc: epic → issue → sub-issue (tối đa 3 cấp, dùng sub-issue thật của GitHub).
#   id      id nội bộ, ổn định: I-NNN = issue từ WU-NNN · I-NNN.k = sub-issue · X-xx = issue thêm khi break (thiết kế / 要確認)
#   wu      WU nguồn trong handoff (rỗng nếu là issue thêm)
#   kind    DB · API · UI · batch · test · hạ tầng · tài liệu · thiết kế · 要確認
#   owner   担当(仮): FE-A FE-B BE-A BE-B QA-A PM (người giả định)
#   hours   CHỈ item lá (≤ 15h). Issue cha / epic = tổng con, script tự cộng (estimate.md §3 quy tắc 4)
#   sprint  1 · 2 · 3 · ~ (backlog, chưa xếp)
#   deps    id nội bộ phải xong trước (issue = mọi item lá bên dưới)
#   constraint  mặc định theo epic (E10 = 完納奨励金, còn lại なし)
